name: Testes do Orbit

# Corre os testes da app orbit num Frappe montado de raiz, com MariaDB e Redis
# do próprio GitHub. Nada disto toca no Apps02: é ali ao lado que estão os
# tenants dos clientes, e um teste que corresse lá era um teste em produção.
#
# Instala-se o CRM porque o módulo Marketing lê os leads e o painel do CRM;
# sem ele os testes passavam por um caminho que nenhum tenant percorre.

on:
  push:
    branches-ignore: [main]
    paths: ["orbit/**", ".github/workflows/testes.yml", "pyproject.toml"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=20
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
        with:
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Bench
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client wkhtmltopdf >/dev/null || true
          pip install -q frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" bench
          cd bench
          bench set-config -g redis_cache redis://localhost:13000
          bench set-config -g redis_queue redis://localhost:11000
          bench set-config -g redis_socketio redis://localhost:13000
          bench get-app --skip-assets crm https://github.com/frappe/crm --branch main
          bench get-app --skip-assets orbit "$GITHUB_WORKSPACE/app"
      - name: Site
        working-directory: bench
        run: |
          bench new-site teste.local --db-root-password root --admin-password admin \
            --mariadb-user-host-login-scope=% --install-app crm --install-app orbit
          bench --site teste.local set-config allow_tests true
      - name: Testes
        working-directory: bench
        run: bench --site teste.local run-tests --app orbit --module orbit.marketing.test_marketing
